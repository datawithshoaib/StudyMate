[project]
name = "studymate-backend"
version = "0.1.0"
description = "StudyMate FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "pdfplumber>=0.11.11",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
